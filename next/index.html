<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>
// 독립 페이지용 연결부: 아티팩트의 claude.use(...) 자리에 Supabase 함수(takeout-api)를 직접 부르는 구현을 끼운다.
// 열쇠는 코드에 없다 — 주소 끝의 #k=... 에서 읽고, 이 기기에 기억해 둔다.
(() => {
  const API = "https://omigzdxdxywtjsfzimks.supabase.co/functions/v1/takeout-api";
  let k = (location.hash.match(/k=([^&]+)/) || [])[1] || "";
  try { if (k) localStorage.setItem("takeout-key", k); else k = localStorage.getItem("takeout-key") || ""; } catch (_) {}
  const url = (api) => `${API}?k=${encodeURIComponent(k)}&api=${api}`;
  const j = async (r) => {
    if (!r.ok) { const e = new Error(`HTTP ${r.status}`); e.code = r.status === 403 ? "열쇠가 맞지 않아요" : `HTTP ${r.status}`; throw e; }
    return r.json();
  };
  const ns = {
    mcp: { callTool: async () => ({ payload: [{ j: await j(await fetch(url("menu"), { cache: "no-store" })) }] }),
      sync: async () => j(await fetch(url("sync"), { cache: "no-store" })),
      setPrice: async (name, price) => j(await fetch(`${API.replace("takeout-api", "takeout-price")}?k=${encodeURIComponent(k)}&api=set`, { method: "POST", body: JSON.stringify({ name, price }) })),
      ping: async (id) => j(await fetch(`${url("ping")}&id=${encodeURIComponent(id)}`, { cache: "no-store" })) }, // 새로고침 버튼: 식당 메뉴를 지금 다시 받아 온다
    user: { id: async () => "shared" },
    db: { doc: () => ({
      get: async () => { const d = (await j(await fetch(url("state"), { cache: "no-store" }))).data; return { exists: !!d, data: () => d }; },
      set: async (v) => { await j(await fetch(url("state"), { method: "POST", body: JSON.stringify(v) })); }, // 글자 본문 = 사전 요청 없는 단순 POST
    }) },
    // 이미지는 iPhone 공유 시트로 바로 넘긴다
    downloads: { save: async ({ filename, data }) => {
      const f = new File([data], filename, { type: "image/png" });
      const err = (code) => Object.assign(new Error(code), { code });
      if (!navigator.canShare || !navigator.canShare({ files: [f] })) throw err("unavailable");
      try { await navigator.share({ files: [f] }); return { status: "saved" }; }
      catch (e) { throw err(e && e.name === "AbortError" ? "declined" : "unavailable"); }
    } },
  };
  window.claude = { use: async (n) => (k ? ns[n] || null : null) };

  // 열쇠 없이 열렸을 때: 열쇠(또는 열쇠가 붙은 주소)를 한 번 붙여 넣게 한다
  if (!k) addEventListener("DOMContentLoaded", () => {
    const box = document.createElement("div");
    box.style.cssText = "position:fixed;inset:0;z-index:99;background:#fff;display:grid;place-content:center;gap:12px;padding:24px;font:400 15px -apple-system,system-ui,sans-serif;color:#1D1B14;text-align:center";
    box.innerHTML = `<b style="font-size:17px">열쇠가 필요해요</b><span style="color:rgba(29,27,20,.5);font-size:13px">받은 주소 전체나 열쇠를 붙여 넣어 주세요</span>
      <input id="kin" autocomplete="off" autocapitalize="off" style="font:inherit;padding:12px 14px;border-radius:12px;border:0;background:rgba(29,27,20,.06);width:min(280px,80vw);text-align:center">
      <button id="kgo" style="font:600 15px inherit;padding:12px;border-radius:999px;border:0;background:#5B5121;color:#fff">열기</button>`;
    document.body.appendChild(box);
    box.querySelector("#kgo").addEventListener("click", () => {
      const v = box.querySelector("#kin").value.trim(), m = v.match(/k=([^&\s]+)/);
      const key = m ? m[1] : v; if (!key) return;
      try { localStorage.setItem("takeout-key", key); } catch (_) {}
      location.hash = `k=${key}`; location.reload();
    });
  });

  // 다시 앞으로 꺼냈을 때 오래됐으면 새로 읽는다 — 상대가 고른 것과 새 메뉴가 보이게
  let hiddenAt = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (hiddenAt && Date.now() - hiddenAt > 60_000) location.reload();
  });
})();
</script></head><body>
<title>happeachne takeout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300;400;600&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: deep green header band (date + meal) → sticky category rail → 2-col tile grid → fixed tray with coin meter and copy.
   Point colour: basil green + egg-yolk yellow — away from Samsung blue and Welstory orange, warm and appetising. */
:root {
  --bg: #FFFFFF;
  --tile: #FFFFFF;
  --page: #FFFFFF;
  --card: #F6F5F2;
  --ink: #1D1B14;
  --muted: rgba(29, 27, 20, .5);
  --line: rgba(29, 27, 20, .1);
  --band: #5B5121;
  --band-ink: #FBF5EC;
  --band-dim: rgba(251, 245, 236, .62);
  --gold: #EBDD8E;
  --gold-deep: #5B5121;
  --sel: #FCE2C3; --viz-save: #77670F; --viz-paid: #E0703A;
  --sel-ink: #2A2510;
  --btn: #5B5121;
  --btn-ink: #FFFFFF;
  --edge: rgba(91, 81, 33, .32);
  --soft: #F0E9C8;
  --warn: #ED6328;
  --heart: #ED6328;
  --coin: #5B5121;
  --well: rgba(29, 27, 20, .06);
  --coin-pick: #BFA732;
  --mark: #EBDD8E;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Asta Sans", system-ui, sans-serif;
  --mono: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Asta Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121210; --tile: #2A2922; --page: #121210; --card: #1C1B17; --ink: #F3ECDD; --muted: rgba(243, 236, 221, .58); --line: rgba(243, 236, 221, .13);
    --band: #2B2610; --band-ink: #F3ECDD; --band-dim: rgba(243, 236, 221, .5); --gold: #E6D588; --gold-deep: #CDB84A;
    --sel: #F6DDB8; --viz-save: #7A6B14; --viz-paid: #D87244; --sel-ink: #2A2510; --btn: #CDB84A; --btn-ink: #17150C; --edge: rgba(205, 184, 74, .38); --soft: #353017; --warn: #F0774A; --heart: #F0774A; --coin: #DDD3A8; --well: rgba(243, 236, 221, .08); --coin-pick: #BFA732; --mark: rgba(230, 213, 136, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121210; --tile: #2A2922; --page: #121210; --card: #1C1B17; --ink: #F3ECDD; --muted: rgba(243, 236, 221, .58); --line: rgba(243, 236, 221, .13);
    --band: #2B2610; --band-ink: #F3ECDD; --band-dim: rgba(243, 236, 221, .5); --gold: #E6D588; --gold-deep: #CDB84A;
    --sel: #F6DDB8; --viz-save: #7A6B14; --viz-paid: #D87244; --sel-ink: #2A2510; --btn: #CDB84A; --btn-ink: #17150C; --edge: rgba(205, 184, 74, .38); --soft: #353017; --warn: #F0774A; --heart: #F0774A; --coin: #DDD3A8; --well: rgba(243, 236, 221, .08); --coin-pick: #BFA732; --mark: rgba(230, 213, 136, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
button { touch-action: manipulation; }
.tile .add *, .radd * { pointer-events: none; }
/* 글자: 11 / 13 / 15 / 17 / 34, 굵기 400 · 600. 간격: 4의 배수. 모서리: 카드 14, 컨트롤 10, 알약 999. 선 대신 면으로 구분. */
body { background: var(--page); color: var(--ink); font: 300 15px/1.4 var(--sans); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible { outline: 2px solid var(--btn); outline-offset: 2px; }
.gutter { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.combo-h b, .fold-t, .sheet .sh b { text-transform: uppercase; letter-spacing: .06em; }
.rq, .qty, .pill b, .kc { font-variant-numeric: tabular-nums; }

/* header — 1) 식당·갱신 시각(작게) 2) 날짜 제목 + 끼니 3) 카테고리 + 보기 전환 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: .5px solid var(--line); }
.band .gutter { padding-block: 14px 14px; display: grid; gap: 14px; }
.util { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.rtabs { display: flex; gap: 14px; }
.rtabs button { font-size: 13px; color: var(--muted); padding: 2px 0; }
.rtabs button[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
#stamp { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; padding: 6px 0 6px 10px; margin: -6px 0; }
#stamp svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
#stamp.busy svg { animation: spin .9s linear infinite; }
#stamp:disabled { cursor: default; }
.utilr { display: inline-flex; align-items: center; gap: 4px; }
.livew { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--heart); white-space: nowrap; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--heart); animation: live 1.6s ease-in-out infinite; }
@keyframes live { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .25; transform: scale(.7); } }
@keyframes spin { to { transform: rotate(360deg); } }
.when { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.week { display: flex; gap: 16px; align-items: baseline; min-width: 0; }
.day { display: inline-flex; align-items: baseline; gap: 5px; color: var(--muted); position: relative; }
.day .dn { font-size: 17px; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; }
.day .wl { font-size: 13px; line-height: 1; }
.day[aria-pressed="true"] { color: var(--ink); }
.day[aria-pressed="true"] .dn { font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
.day[aria-pressed="true"] .wl { font-size: 17px; font-weight: 600; }
.day.today::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--heart); align-self: flex-start; margin: 2px 0 0 -2px; }
.sg { display: inline-flex; flex: none; background: var(--well); border-radius: 999px; padding: 3px; min-width: 0; }
.sg button { flex: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 400; line-height: 1.2; color: var(--muted); text-align: center; white-space: nowrap; }
.sg button[aria-pressed="true"] { background: var(--tile); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(29, 27, 20, .12); }
.sg .cnt { font-size: 11px; font-weight: 600; color: var(--heart); margin-left: 4px; }

/* category rail */
.rail .gutter { display: flex; align-items: center; gap: 8px; padding-block: 0 12px; }
.rs { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); }
.rs::-webkit-scrollbar { display: none; }
.rs::after { content: ""; flex: none; width: 16px; }
.vbtn { flex: none; width: 38px; height: 32px; border-radius: 999px; background: var(--well); display: grid; place-items: center; color: var(--ink); }
.vbtn svg { width: 14px; height: 14px; fill: currentColor; pointer-events: none; }
svg.ln { fill: none !important; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
.viewopt .vbtn + .vbtn { margin-left: -4px; }
.qbox { flex: 1; min-width: 0; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 999px; background: var(--well); color: var(--muted); }
.qbox svg { width: 14px; height: 14px; flex: none; }
.qbox input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); font: 400 16px var(--sans); padding: 0; -webkit-appearance: none; appearance: none; }
.qbox input::-webkit-search-cancel-button { display: none; }
.rail button[data-cat], .rail .editbtn { flex: none; padding: 7px 12px; border-radius: 999px; font-size: 13px; color: var(--ink); display: inline-flex; gap: 4px; align-items: center; }
.rail button .n { font-size: 11px; opacity: .45; }
.rail button[aria-pressed="true"][data-cat] { background: var(--btn); color: var(--btn-ink); font-weight: 600; }
.rail button.has::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--gold-deep); }
.rail button[aria-pressed="true"].has::after { background: var(--btn-ink); }
.rail button .hrt { color: var(--heart); width: 11px; height: 11px; }
.rail .editbtn { color: var(--muted); }
.rail .editbtn[aria-pressed="true"] { background: var(--soft); color: var(--gold-deep); }
.rail button.off { text-decoration: line-through; opacity: .5; }

/* list */
main .gutter { padding-block: 20px calc(170px + env(safe-area-inset-bottom, 0px)); }
.hint { font-size: 12px; color: var(--muted); margin: 0 0 16px; }
.hint .hrt { display: inline-block; width: 11px; height: 11px; vertical-align: -1px; }
.viewopt { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: -4px 0 16px; }
.vnote { flex: 1; font-size: 12px; color: var(--muted); min-width: 0; }
.viewopt .sg { flex: none; }
.viewopt .sg { padding: 3px; box-shadow: 0 0 0 .5px var(--line); }
.viewopt .sg button { width: 36px; padding: 6px 0; display: grid; place-items: center; color: var(--muted); }
.viewopt .sg button[aria-pressed="true"] { color: var(--ink); }
.viewopt .sg svg { width: 14px; height: 14px; fill: currentColor; pointer-events: none; }
.blkhint { margin-right: auto; font-size: 12px; color: var(--muted); }
.cap { grid-column: 1 / -1; margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--ink); }
.cap.sep { margin-top: 28px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 520px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* tiles — 목록 줄과 같은 문법을 카드로: 체크 원, 이름, 보조 줄, 수량 캡슐 */
.tile { position: relative; background: var(--card); border-radius: 14px; min-width: 0; display: grid; }
.tile .add { display: grid; grid-template-rows: auto auto 1fr; gap: 8px; align-content: start; width: 100%; padding: 14px 14px 16px; }
.tile .lead { margin-bottom: 8px; }
.tile .name { font-size: 14px; font-weight: 400; line-height: 1.3; overflow-wrap: anywhere; }
.tile .rsub { align-self: start; flex-wrap: wrap; row-gap: 4px; }
.tile.on, .combo[aria-pressed="true"], .rows li.on { background: var(--soft); }
.tile.on .lead { background: var(--btn); box-shadow: none; }
.tile.on .lead svg { opacity: 1; }
.tile.on .add { padding-bottom: 58px; }
.tile .rq { position: absolute; right: 12px; bottom: 12px; }
.coin { display: flex; align-items: center; gap: 3px; min-height: 16px; color: var(--coin); }
.coin i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.coin.pk i { background: var(--coin-pick); }
.coin i.o { background: transparent; border: 1.5px solid currentColor; }
.coin .v { font-size: 11px; line-height: 1; color: var(--muted); }
.tile .meta { font-size: 11px; color: var(--muted); }
.star { position: absolute; top: 6px; right: 4px; width: 40px; height: 40px; color: var(--muted); display: grid; place-items: center; }
.hrt { width: 14px; height: 14px; display: block; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; pointer-events: none; }
.hrt.f { fill: currentColor; }
.star[aria-pressed="true"], .rstar[aria-pressed="true"] { color: var(--heart); }
.grid > .gh { grid-column: 1 / -1; margin: 12px 16px -4px; }
.grid > .gh:first-child { margin-top: 0; }
.tile.muted { opacity: .38; }
.tile.muted .name { text-decoration: line-through; }
.tile.blk .add, .rows li.blk .radd { opacity: .3; }
.editbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.editbar .hint { margin: 0; }
.catoff { padding: 6px 12px; border-radius: 999px; font-size: 13px; background: var(--well); }

/* rows — iOS 묶음 목록: 머리글은 카드 밖, 줄은 제목+보조 줄, 구분선은 글자 시작점부터 */
.gh { margin: 24px 16px 8px; font-size: 12px; color: var(--muted); }
.gh:first-of-type { margin-top: 0; }
.rows { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; overflow: hidden; }
.rows li { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto 40px; align-items: center; min-height: 60px; padding-left: 16px; }
.rows li + li::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: .5px; background: var(--line); }
.radd { display: flex; align-items: flex-start; gap: 12px; min-width: 0; padding: 14px 8px 14px 0; }
.radd .lead { flex: none; }
.radd .rt { flex: 1; }
.radd .ph { margin: -2px 4px -2px 4px; align-self: center; }
.radd .lead { margin-top: -1px; } /* 체크 원을 이름 첫 줄의 가운데에 */
.lead { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); display: grid; place-items: center; }
.lead svg { width: 12px; height: 12px; fill: none; stroke: var(--btn-ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.rows li.on .lead { background: var(--btn); box-shadow: none; }
.rows li.on .lead svg { opacity: 1; }
.rt { display: grid; gap: 7px; min-width: 0; }
.rname { font-size: 14px; line-height: 1.3; font-weight: 400; overflow-wrap: anywhere; }
.sold { display: inline-block; font-style: normal; font-size: 10px; font-weight: 600; line-height: 16px; padding: 0 6px; margin-right: 6px; border-radius: 999px; background: var(--well); color: var(--muted); vertical-align: 1px; white-space: nowrap; }
.rsub { display: flex; align-items: center; gap: 6px; font-size: 11px; line-height: 1.2; color: var(--muted); min-width: 0; }
.rsub .coin { min-height: 0; flex: none; }
.rsub .coin i { width: 6px; height: 6px; }
.rq { display: inline-flex; align-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.rq:not(:empty) { background: var(--well); border-radius: 999px; padding: 2px; }
.rq span { min-width: 18px; text-align: center; line-height: 28px; font-weight: 400; }
.rq button svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; pointer-events: none; }
.rq button { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 400 17px/1 var(--sans); }
.rstar { width: 40px; height: 44px; color: var(--muted); display: grid; place-items: center; }
.fold { margin-top: 8px; }
.fold-h { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 12px 0; }
.fold-t { font: 600 11px var(--mono); }
.fold-h .n { font-size: 12px; color: var(--muted); }

/* combos */
.combos { display: grid; gap: 12px; margin-bottom: 24px; }
@media (min-width: 520px) { .combos { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.combo { border-radius: 14px; padding: 16px; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--card); min-width: 0; width: 100%; }
.combo * { pointer-events: none; }
.combo .lead { margin-top: 0; }
.combo-b { display: grid; gap: 10px; min-width: 0; }
.combo-h { display: flex; justify-content: space-between; align-items: center; min-height: 22px; line-height: 1; font-size: 12px; color: var(--muted); margin-bottom: 0; }

  try { await navigator.clipboard.writeText(text); ok = true; } catch (_) {}
  const t = $("fallback");
  if (!ok) { t.hidden = false; t.value = text; t.focus(); t.select(); } else t.hidden = true;
  for (const x of S.rests) for (const m of Object.keys(MEALS)) { const p = S.picks[keyOf(S.date, m, x.id)]; if (p && Object.keys(p.items || {}).length) p.sent = true; }
  save(); render();
  toast(ok ? "복사했습니다" : "위 글을 길게 눌러 복사해주세요.");
}
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2200); }

// ---------- events ----------
window.addEventListener("error", (e) => toast(`오류: ${e.message}`));
window.addEventListener("unhandledrejection", (e) => toast(`오류: ${e.reason?.message || e.reason}`));
// 탭 진단: 터치가 페이지까지 오는지, click 이 따라오는지 세어 상단에 표시한다
const DIAG = { down: 0, up: 0, click: 0, handled: 0 };
let pendingUp = null, lastHandled = 0;
function diag() { const el = $("diag"); if (el) el.textContent = `터치 ${DIAG.down}·${DIAG.up} / 클릭 ${DIAG.click} / 처리 ${DIAG.handled}`; }
function handle(e) {
  const now = Date.now();
  try { onTap(e); DIAG.handled++; } catch (err) { toast(`오류: ${err.message}`); console.error(err); }
  diag();
}
// click 만 듣는다 — 브라우저는 스크롤 드래그를 click 으로 보내지 않는다
document.addEventListener("click", (e) => handle(e), true);
// 메모는 치는 동안 화면을 다시 그리지 않는다 (입력 중 커서가 튀지 않게)
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { S.q = e.target.value; const lb = $("lbody"); if (lb) lb.innerHTML = S.find(S.q); return; }
  if (e.target.id === "memo") { S.memo[S.date] = e.target.value; save(); }
  if (e.target.classList?.contains("swapin")) { // 바꾼 메뉴 이름 — 재고에도 그 이름으로 올린다
    const k = e.target.dataset.k, n = e.target.dataset.n, p = S.picks[k]; if (!p) return;
    (p.swapTo || (p.swapTo = {}))[n] = e.target.value;
    save();
  }
});
// 가격 출처: 어디서 나온 값인지 보여 주고, 아는 값이 있으면 그 자리에서 고친다
const SRC_LABEL = { web: "웹 검색으로 확인한 가격", est: "AI가 비슷한 상품으로 추정한 가격", manual: "직접 입력한 가격", naver: "웹 검색으로 확인한 가격" };
function findItem(name) { for (const x of S.rests) for (const m of Object.keys(MEALS)) { const it = itemsFor(S.date, m, x.id).find((y) => y.name === name); if (it) return it; } return null; }
async function openPrice(name) {
  const it = findItem(name); if (!it) return;
  const mcp = await claude.use("mcp"), canEdit = !!mcp?.setPrice;
  let host = ""; try { host = it.plink ? new URL(it.plink).hostname.replace(/^www\./, "") : ""; } catch (_) {}
  const el = $("sheet");
  el.innerHTML = `<button class="scrim" id="sheetclose" aria-label="닫기"></button><div class="panel psheet" role="dialog" aria-label="시중가"><div class="grab"></div>
    <div class="sh"><b>Market Price</b><button id="sheetclose2" aria-label="닫기"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8"/></svg></button></div>
    <p class="pname">${esc(it.name)}</p><div class="pbig">${won(it)}</div>
    <p class="psrc">${SRC_LABEL[it.psrc] || ""}</p>
    ${it.plink ? `<a class="plink" href="${esc(it.plink)}" target="_blank" rel="noopener">${esc(it.ptitle || it.plink)}<small>${esc(host)} ↗</small></a>` : ""}
    ${canEdit ? `<p class="gh">가격 고치기</p><div class="pedit"><input id="pval" inputmode="numeric" pattern="[0-9]*" value="${it.price}" aria-label="가격(원)"><button class="copy" id="psave" data-name="${esc(it.name)}">저장</button></div>` : ""}</div>`;
  el.hidden = false;
}
async function savePrice(name) {
  const v = parseInt(String($("pval").value).replace(/[^0-9]/g, ""), 10);
  if (!(v > 0)) { toast("가격을 숫자로 입력해 주세요."); return; }
  try {
    const mcp = await claude.use("mcp"); await mcp.setPrice(name, v);
    for (const r of S.rows) if (r.n.replace(SOLD, "").trim() === name) { r.pr = v; r.ps = "manual"; r.pt = null; r.pl = null; }
    cache.clear(); $("sheet").hidden = true; $("sheet").innerHTML = ""; render(); toast("가격을 고쳤습니다");
  } catch (e) { toast("저장하지 못했어요."); }
}
// 탭 이동: 기기마다 마지막으로 보던 탭을 기억한다(남편은 Cart, 집에서는 Stock)
function goTab(t) { S.tab = t; S.rateOrder = null; try { localStorage.setItem("takeout-tab", t); } catch (_) {} render(); scrollTo(0, 0); }
function onTap(e) {
  const ph = e.target.closest("[data-photo]");
  if (ph) { // 큰 사진
    const it = itemsFor(S.date, S.meal).find((x) => x.name === ph.dataset.photo); if (!it?.photo) return;
    const el = $("photo"); el.innerHTML = `<img alt="" src="${esc(PHOTO_BASE + it.photo)}"><span>${esc(it.name)}</span>`; el.hidden = false; return;
  }
  const pr = e.target.closest("[data-price]");
  if (pr) { openPrice(pr.dataset.price); return; }
  const b = e.target.closest("button");
  // 트레이는 버튼 말고 어디를 눌러도 목록이 열린다
  if ($("shmenu") && !$("shmenu").hidden && !e.target.closest(".shwrap")) { $("shmenu").hidden = true; return; }
  if (!b) { if (e.target.closest(".tray")) goTab("cart"); return; }
  if (b.dataset.nav) { goTab(b.dataset.nav); return; }
  if (b.dataset.scat != null) { S.stockCat = b.dataset.scat || null; renderSheet(); return; }
  if (b.id === "psave") { savePrice(b.dataset.name); return; }
  if (b.dataset.rday) { S.repDay = b.dataset.rday; renderSheet(); return; }
  if (b.dataset.rmonth) { S.repMonth = b.dataset.rmonth; renderSheet(); return; }
  const k = b.dataset.k || keyOf(S.date, S.meal);
  if (b.id === "sheetclose" || b.id === "sheetclose2") { $("sheet").hidden = true; $("sheet").innerHTML = ""; return; }
  if (b.id === "stamp") { refreshMenu(); return; }
  if (b.dataset.qopen != null) { S.q = ""; render(); $("q")?.focus(); return; }
  if (b.dataset.qclose != null) { S.q = null; render(); return; }
  if (b.dataset.view) { S.view = b.dataset.view; save(); render(); return; }
  if (b.id === "photo") { b.hidden = true; b.innerHTML = ""; return; }
  if (b.dataset.ate) { const dm = b.dataset.ate; if (S.ate[dm] === b.dataset.rid) delete S.ate[dm]; else S.ate[dm] = b.dataset.rid; save(); render(); return; }
  if (b.dataset.mode) { S.mode[b.dataset.mk] = b.dataset.mode; save(); render(); return; }
  if (b.dataset.rank) { // 순위 칩: 1순위를 누르면 다른 곳이 1순위로, 2순위를 누르면 그곳이 1순위로
    const key = b.dataset.rank, other = pickedRests(S.date, key.slice(9)).find((x) => x.id !== b.dataset.rid);
    S.rank[key] = b.classList.contains("first") && other ? other.id : b.dataset.rid;
    save(); render(); return;
  }

  if (b.dataset.eat != null) { // 먹었어요: 하나씩 줄고, 다 먹으면 사라진다
    const e = S.stock.find((x) => x.src === b.dataset.eat); if (!e) return;
    S.eaten.push({ ...e, q: 1 }); S.eaten = S.eaten.slice(-20);
    if (e.q > 1) e.q -= 1; else S.stock = S.stock.filter((x) => x !== e);
    save(); render(); return;
  }
  if (b.dataset.eatsel != null) { const k2 = b.dataset.eatsel; if (S.eatSel.has(k2)) S.eatSel.delete(k2); else S.eatSel.add(k2); renderSheet(); return; }
  if (b.id === "eatdone") { // 취식 완료: 체크한 것을 하나씩 먹은 것으로 옮긴다
    for (const src of S.eatSel) { const e = S.stock.find((x) => x.src === src); if (!e) continue;
      S.eaten.push({ ...e, q: 1 }); if (e.q > 1) e.q -= 1; else S.stock = S.stock.filter((x) => x !== e); }
    S.eaten = S.eaten.slice(-20); S.eatSel.clear(); save(); render(); toast("RATINGS에 추가됨"); return;
  }
  if (b.dataset.rfil != null) { S.rateFilter = +b.dataset.rfil || null; renderSheet(); return; }
  if (b.dataset.rate != null) { // 별점: 같은 점수를 다시 누르면 지운다
    const v = +b.dataset.v, nm = b.dataset.rate;
    if (S.rate[nm] === v) delete S.rate[nm]; else S.rate[nm] = v;
    cache.clear(); save(); render(); return;
  }
  if (b.dataset.uneat != null) { // 되돌리기
    const e = S.eaten[+b.dataset.uneat]; if (!e) return;
    S.eaten.splice(+b.dataset.uneat, 1);
    const cur = S.stock.find((x) => x.src === e.src); if (cur) cur.q = (cur.q || 1) + 1; else S.stock.push({ ...e, q: 1 });
    save(); render(); return;
  }
  if (b.id === "takedone") { commitDay(S.date); save(); render(); toast("STOCK에 추가됨"); return; }
  if (b.dataset.undone) { uncommit(b.dataset.undone); save(); render(); return; }
  if (b.dataset.got != null) { setGot(k, b.dataset.got, S.picks[k]?.got?.[b.dataset.got] ? null : "ok"); save(); render(); return; }
  if (b.dataset.ungot != null) { unGot(k, b.dataset.ungot); save(); render(); return; }
  if (b.dataset.gotall) { // 한 번에 체크 / 다시 누르면 전부 해제
    const kk = b.dataset.gotall, p = S.picks[kk]; if (!p) return;
    if (p.done) return;
    if (b.getAttribute("aria-pressed") === "true") unGotAll(kk);
    else for (const n of Object.keys(p.items || {})) if (!p.got?.[n]) setGot(kk, n, "ok");
    save(); render(); return;
  }
  if (b.dataset.clear) { unGotAll(b.dataset.clear); delete S.picks[b.dataset.clear]; save(); render(); return; }
  if (b.dataset.del != null) { const p = S.picks[k]; unGot(k, b.dataset.del); if (p?.items) { delete p.items[b.dataset.del]; p.sent = false; } save(); render(); return; }
  if (b.dataset.rest) { S.rest = b.dataset.rest; S.cat = null; S.catTouched = false; save(); render(); scrollTo(0, 0); return; }
  if (b.dataset.date) { S.date = b.dataset.date; S.cat = null; render(); scrollTo(0, 0); return; }
  if (b.dataset.meal) { S.meal = b.dataset.meal; S.cat = null; render(); scrollTo(0, 0); return; }
  if (b.dataset.cat) { S.q = null; S.cat = b.dataset.cat; S.catTouched = true; render(); b.scrollIntoView({ inline: "center", block: "nearest" }); return; }
  if (b.dataset.portion) { S.portions[k] = +b.dataset.portion; save(); render(); return; }
  if (b.id === "edit") { S.edit = !S.edit; render(); return; }
  if (b.id === "ratefold") { S.rateOpen = !S.rateOpen; S.rateOrder = null; renderSheet(); return; }
  if (b.id === "fold") { S.foldOpen = !S.foldOpen; render(); return; }
  if (b.dataset.hide != null) { const n = b.dataset.hide; S.hide.has(n) ? S.hide.delete(n) : S.hide.add(n); save(); render(); return; }
  if (b.dataset.hidecat != null) { const c = b.dataset.hidecat; S.hideCats.has(c) ? S.hideCats.delete(c) : S.hideCats.add(c); save(); render(); return; }
  if (b.dataset.combo != null) {
    const c = S.combos[+b.dataset.combo]; if (!c) return;
    const items = {};
    for (const it of c.items) items[it.name] = (items[it.name] || 0) + 1;
    if (c.drink) items[c.drink.name] = portionsOf(k);
    unGotAll(k);
    if (comboOn(c, S.picks[k]?.items || {})) delete S.picks[k]; // 다시 누르면 비운다
    else S.picks[k] = { items, sent: false };
    save(); render(); return;
  }
  if (b.id === "copy") { $("shmenu").hidden = true; copy(); return; }
  if (b.id === "shareimg") { $("shmenu").hidden = true; shareImage(); return; }
  if (b.id === "share") { $("shmenu").hidden = !$("shmenu").hidden; return; }
  if (b.id === "clear") { delete S.picks[k]; save(); render(); return; }
  if (b.id === "reload") { load(true); return; }
  if (b.dataset.star != null) { const n = b.dataset.star; S.fav.has(n) ? S.fav.delete(n) : S.fav.add(n); save(); render(); return; }
  if (b.dataset.tog != null) { // 목록의 체크 원: 누르면 담고, 다시 누르면 뺀다
    const p = S.picks[k] || (S.picks[k] = { items: {} });
    if (!p.items || typeof p.items !== "object") p.items = {};
    const n = b.dataset.tog;
    if (p.items[n]) { unGot(k, n); delete p.items[n]; } else p.items[n] = 1;
    p.sent = false; save(); render(); return;
  }
  if (b.dataset.add != null || b.dataset.sub != null) {
    const p = S.picks[k] || (S.picks[k] = { items: {} });
    if (!p.items || typeof p.items !== "object") p.items = {};
    const n = b.dataset.add ?? b.dataset.sub;
    p.items[n] = Math.max(0, (p.items[n] || 0) + (b.dataset.add != null ? 1 : -1));
    if (!p.items[n]) { unGot(k, n); delete p.items[n]; }
    p.sent = false;
    save(); render();
  }
}

// 갱신 시각 + 동그란 화살표: 누르면 메뉴를 새로 가져온다
function setStamp() {
  $("stamp").innerHTML = `${S.updated ? `<span>${esc(S.updated)}</span>` : ""}<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M12 7a5 5 0 1 1-1.600-3.660M12 1.800V4.200H9.600"/></svg>`;
  $("stamp").classList.toggle("busy", !!S.syncing); $("stamp").disabled = !!S.syncing;
}
async function refreshMenu() {
  if (S.syncing) return;
  S.syncing = true; setStamp();
  try {
    const mcp = await claude.use("mcp");
    if (mcp?.sync) await mcp.sync().catch(() => toast("새로 가져오지 못했어요. 저장된 메뉴를 다시 읽을게요.")); // 독립 페이지: 식당에서 지금 다시 받아 온다
    await load(true);
  } finally { S.syncing = false; setStamp(); }
}
// ---------- load ----------
async function load(refresh = false) {
  const mcp = await claude.use("mcp");
  if (!mcp) { showState("열쇠가 없어 메뉴를 불러올 수 없어요."); return; }
  try {
    const res = await mcp.callTool("Supabase", "execute_sql", { project_id: PROJECT, query: QUERY },
      { cache: { staleTime: 10 * 60e3, gcTime: 2 * 86400e3, ...(refresh ? { refresh: true } : {}) } });
    S.rows = parsePayload(res.payload);
    const seen = new Map();
    for (const r of S.rows) if (!seen.has(r.r)) seen.set(r.r, r.rn || r.r);
    S.rests = [...seen].map(([id, name]) => ({ id, name })).sort((a, b) => (b.id === "REST000007") - (a.id === "REST000007"));
    cache.clear();
    const u = S.rows.reduce((a, r) => (r.u > a ? r.u : a), "");
    if (u) {
      const t = new Date(new Date(u).getTime() + 9 * 3600e3);
      const hm = `${String(t.getUTCHours()).padStart(2, "0")}:${String(t.getUTCMinutes()).padStart(2, "0")}`;
      const same = t.toISOString().slice(0, 10).replace(/-/g, "") === todayYmd();
      S.updated = same ? hm : `${t.getUTCMonth() + 1}/${t.getUTCDate()} ${hm}`;
    } else S.updated = null;
    if (!S.rows.length) { showState("저장된 메뉴가 없습니다. 메뉴 갱신이 아직 돌지 않았을 수 있습니다.", true); return; }
    render();
  } catch (e) {
    const code = e?.code;
    const msg = {
      server_not_connected: "Supabase 커넥터가 연결되어 있지 않습니다. claude.ai 설정의 커넥터에서 Supabase를 추가해주세요.",
      needs_reauth: "Supabase 연결이 만료되었습니다. claude.ai 설정의 커넥터에서 다시 연결해주세요.",
      not_in_manifest: "이 페이지의 Supabase 접근이 꺼져 있습니다. 페이지 권한에서 Supabase를 허용해주세요.",
      approval_required: "메뉴를 읽으려면 Supabase 접근 승인이 필요합니다.",
      selection_required: "Supabase 커넥터가 여러 개입니다. 사용할 것을 골라주세요.",
    }[code] || `메뉴를 불러오지 못했습니다 (${code || "오류"}).`;
    showState(msg, code !== "server_not_connected" && code !== "needs_reauth");
  }
}
function showState(text, retry) {
  $("list").innerHTML = `<div class="empty"><span>${esc(text)}</span>${retry ? `<button id="reload">다시 불러오기</button>` : ""}</div>`;
}

load();
initStore();
</script>
